openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Faster Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: employees
  - name: documents
  - name: payslips
  - name: cuds
  - name: company-docs
  - name: expirations
  - name: activities
  - name: dashboard
  - name: settings
  - name: search
  - name: backup

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          description: Unauthorized

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/documents-by-month:
    get:
      operationId: getDocumentsByMonth
      tags: [dashboard]
      summary: Documents uploaded per month (last 12 months)
      responses:
        "200":
          description: Monthly document counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCount"

  /dashboard/recent-activities:
    get:
      operationId: getRecentActivities
      tags: [dashboard]
      summary: Recent activities for dashboard
      responses:
        "200":
          description: Recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /dashboard/recent-documents:
    get:
      operationId: getRecentDocuments
      tags: [dashboard]
      summary: Recently uploaded documents
      responses:
        "200":
          description: Recent documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentDocument"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: mansione
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"

    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "404":
          description: Not found

    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /employees/{id}/photo:
    post:
      operationId: uploadEmployeePhoto
      tags: [employees]
      summary: Upload employee photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"

  /employees/{id}/documents:
    get:
      operationId: listEmployeeDocuments
      tags: [documents]
      summary: List documents for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDocument"

    post:
      operationId: uploadEmployeeDocument
      tags: [documents]
      summary: Upload a document for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDocument"

  /documents/{docId}:
    patch:
      operationId: updateEmployeeDocument
      tags: [documents]
      summary: Update document metadata
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDocument"

    delete:
      operationId: deleteEmployeeDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /documents/{docId}/download:
    get:
      operationId: downloadDocument
      tags: [documents]
      summary: Download a document file
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download

  /employees/{id}/payslips:
    get:
      operationId: listPayslips
      tags: [payslips]
      summary: List payslips for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Payslips list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payslip"

    post:
      operationId: uploadPayslip
      tags: [payslips]
      summary: Upload payslip for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Payslip uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payslip"

  /payslips/{payslipId}:
    delete:
      operationId: deletePayslip
      tags: [payslips]
      summary: Delete a payslip
      parameters:
        - name: payslipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /payslips/{payslipId}/download:
    get:
      operationId: downloadPayslip
      tags: [payslips]
      summary: Download payslip PDF
      parameters:
        - name: payslipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download

  /employees/{id}/cuds:
    get:
      operationId: listCuds
      tags: [cuds]
      summary: List CUDs for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CUDs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cud"

    post:
      operationId: uploadCud
      tags: [cuds]
      summary: Upload CUD for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: CUD uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cud"

  /cuds/{cudId}:
    delete:
      operationId: deleteCud
      tags: [cuds]
      summary: Delete a CUD
      parameters:
        - name: cudId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cuds/{cudId}/download:
    get:
      operationId: downloadCud
      tags: [cuds]
      summary: Download CUD PDF
      parameters:
        - name: cudId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download

  /company-documents:
    get:
      operationId: listCompanyDocuments
      tags: [company-docs]
      summary: List company documents
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Company documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyDocument"

    post:
      operationId: uploadCompanyDocument
      tags: [company-docs]
      summary: Upload a company document
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDocument"

  /company-documents/{docId}:
    delete:
      operationId: deleteCompanyDocument
      tags: [company-docs]
      summary: Delete a company document
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /company-documents/{docId}/download:
    get:
      operationId: downloadCompanyDocument
      tags: [company-docs]
      summary: Download a company document
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download

  /expirations:
    get:
      operationId: listExpirations
      tags: [expirations]
      summary: List all expiring documents
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Expiring documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpirationItem"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activity log
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /settings/logo:
    post:
      operationId: uploadSiteLogo
      tags: [settings]
      summary: Upload site logo
      responses:
        "200":
          description: Logo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /backup/create:
    post:
      operationId: createBackup
      tags: [backup]
      summary: Create manual backup
      responses:
        "200":
          description: Backup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResult"

  /backup/list:
    get:
      operationId: listBackups
      tags: [backup]
      summary: List available backups
      responses:
        "200":
          description: Backups list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupInfo"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, admin]
      properties:
        token:
          type: string
        admin:
          $ref: "#/components/schemas/Admin"

    Admin:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    Employee:
      type: object
      required: [id, employeeCode, firstName, lastName, status, createdAt]
      properties:
        id:
          type: integer
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        fiscalCode:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        hireDate:
          type: ["string", "null"]
        mansione:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, dismissed]
        notes:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    EmployeeDetail:
      type: object
      required: [id, employeeCode, firstName, lastName, status, createdAt, documents, payslips, cuds]
      properties:
        id:
          type: integer
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        fiscalCode:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        hireDate:
          type: ["string", "null"]
        mansione:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, dismissed]
        notes:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeDocument"
        payslips:
          type: array
          items:
            $ref: "#/components/schemas/Payslip"
        cuds:
          type: array
          items:
            $ref: "#/components/schemas/Cud"

    EmployeeInput:
      type: object
      required: [firstName, lastName]
      properties:
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        fiscalCode:
          type: string
        iban:
          type: string
        birthDate:
          type: string
        hireDate:
          type: string
        mansione:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, dismissed]
        notes:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        fiscalCode:
          type: string
        iban:
          type: string
        birthDate:
          type: string
        hireDate:
          type: string
        mansione:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, dismissed]
        notes:
          type: string

    FileUploadResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    EmployeeDocument:
      type: object
      required: [id, employeeId, name, category, uploadedAt, fileUrl, fileName]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        name:
          type: string
        category:
          type: string
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        uploadedAt:
          type: string
        notes:
          type: ["string", "null"]
        fileUrl:
          type: string
        fileName:
          type: string
        fileSize:
          type: ["integer", "null"]

    DocumentUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        notes:
          type: string

    Payslip:
      type: object
      required: [id, employeeId, year, month, uploadedAt, fileUrl, fileName]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        year:
          type: integer
        month:
          type: integer
        uploadedAt:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string

    Cud:
      type: object
      required: [id, employeeId, year, uploadedAt, fileUrl, fileName]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        year:
          type: integer
        uploadedAt:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string

    CompanyDocument:
      type: object
      required: [id, name, category, uploadedAt, fileUrl, fileName]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        uploadedAt:
          type: string
        notes:
          type: ["string", "null"]
        fileUrl:
          type: string
        fileName:
          type: string
        fileSize:
          type: ["integer", "null"]

    ExpirationItem:
      type: object
      required: [id, employeeId, employeeName, documentName, category, endDate, status]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        documentName:
          type: string
        category:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [expired, expiring-soon, valid]
        daysLeft:
          type: ["integer", "null"]

    Activity:
      type: object
      required: [id, action, entity, createdAt]
      properties:
        id:
          type: integer
        action:
          type: string
        entity:
          type: string
        entityId:
          type: ["integer", "null"]
        details:
          type: ["string", "null"]
        createdAt:
          type: string

    ActivityPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    DashboardStats:
      type: object
      required: [totalEmployees, activeEmployees, totalDocuments, expiringDocuments, expiredDocuments, totalPayslips, totalCuds]
      properties:
        totalEmployees:
          type: integer
        activeEmployees:
          type: integer
        totalDocuments:
          type: integer
        expiringDocuments:
          type: integer
        expiredDocuments:
          type: integer
        totalPayslips:
          type: integer
        totalCuds:
          type: integer

    MonthlyCount:
      type: object
      required: [month, year, count]
      properties:
        month:
          type: integer
        year:
          type: integer
        label:
          type: string
        count:
          type: integer

    RecentDocument:
      type: object
      required: [id, name, category, uploadedAt, employeeName, type]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        uploadedAt:
          type: string
        employeeName:
          type: string
        type:
          type: string

    SearchResults:
      type: object
      required: [employees, documents]
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SearchDocumentResult"

    SearchDocumentResult:
      type: object
      required: [id, name, category, employeeName, employeeId, type]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        employeeName:
          type: string
        employeeId:
          type: integer
        type:
          type: string

    SiteSettings:
      type: object
      required: [id, siteName]
      properties:
        id:
          type: integer
        siteName:
          type: string
        logoUrl:
          type: ["string", "null"]

    SiteSettingsUpdate:
      type: object
      properties:
        siteName:
          type: string

    BackupResult:
      type: object
      required: [success, filename, createdAt]
      properties:
        success:
          type: boolean
        filename:
          type: string
        createdAt:
          type: string

    BackupInfo:
      type: object
      required: [filename, createdAt, size]
      properties:
        filename:
          type: string
        createdAt:
          type: string
        size:
          type: integer
