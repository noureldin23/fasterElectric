kind = "web"
previewPath = "/"
title = "Faster Manager"
version = "1.0.0"
id = "artifacts/faster-manager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18781

[services.development]
run = "pnpm --filter @workspace/faster-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/faster-manager", "run", "build" ]
publicDir = "artifacts/faster-manager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18781"
BASE_PATH = "/"
